<!DOCTYPE html>
<html lang="en">
<head>
    <title>Calculater</title>
</head>
<body>
    <button 
    onclick=" cal+='1'; console.log(cal);"
    >
        1
    </button >
     <button  onclick=" cal+='2'; console.log(cal);">
        2
    </button>
     <button  onclick=" cal+='3'; console.log(cal);">
        3
    </button>
     <button  onclick=" cal+='+'; console.log(cal);">
        +
    </button>
     <button  onclick="cal=eval(cal); console.log(cal)">
        =
    </button>

    <script>
        let cal='';
    </script>
</body>
</html>
