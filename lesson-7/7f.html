<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>Functions</title>
</head>
<body>
    <script> 
        function trturnfar(celsius){

            return (celsius * 9 / 5) + 32;
        }

        function rturncel(fahrenheit){

             return (fahrenheit - 32) * 5 / 9;   
        }

        function convert_temp(degree , u){

            if(u==='C'){
                const result =trturnfar(degree);
                return result;
            }elseif(u==='F')
             {
                const result =rturncel(degree);
                return result; 
             }


        }

   
        console.log(convert_temp(25,'C'));
        console.log(convert_temp(86,'F'));
    </script>
</body>
</html>
