 <!DOCTYPE html>
<html lang="en">
<head>
   
    <title>Functions</title>
</head>
<body>
    <script> 
        function greet( name ){
        
                if (!name) {
                console.log('Hi there!');
                } else {
                console.log(`Hello... ${name}!`);
                }
        }

        greet('soham');
        greet("omkar");
        greet();
    </script>
</body>
</html>
